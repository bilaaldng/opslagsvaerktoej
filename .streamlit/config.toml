[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"

# Typografisk identitet: Familjen Grotesk (skandinavisk grotesk, OFL) til
# tekst/overskrifter, JetBrains Mono til tal/kode. Selv-hostet fra ./static
# (ingen CDN — offline-princippet). Falder pænt tilbage til systemfont
# hvis filerne mangler.
font = "Familjen Grotesk, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
headingFont = "Familjen Grotesk, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
codeFont = "JetBrains Mono, ui-monospace, SF Mono, Menlo, monospace"

# Ensretning med theme.css' design-tokens
baseRadius = "13px"
borderColor = "#2b3a55"
linkColor = "#60a5fa"
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#111c33"

# Samme palet som ui_theme.py (C_TOTAL, C_ORDER, C_HOLD, C_OPT, C_MUTED)
chartCategoricalColors = ["#3b82f6", "#f59e0b", "#10b981", "#ef4444", "#64748b"]

[[theme.fontFaces]]
family = "Familjen Grotesk"
url = "app/static/fonts/familjen-normal-latin.woff2"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "Familjen Grotesk"
url = "app/static/fonts/familjen-italic-latin.woff2"
weight = "400 700"
style = "italic"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jbmono-normal-latin.woff2"
weight = "400 700"
style = "normal"

[server]
runOnSave = true
# Serverer ./static på app/static/… — bruges til de selv-hostede fonte
enableStaticServing = true

[browser]
# Ingen telemetri-kald hjem til Streamlit (offline-princippet)
gatherUsageStats = false
